<div class="relative flex flex-col gap-1.5">
  @if (label) {
    <label class="text-xs font-semibold text-[var(--color-neutro-700)] uppercase tracking-wide">
      {{ label }} @if (required) { <span class="text-[var(--color-critico)]">*</span> }
    </label>
  }

  <button
    [id]="inputId"
    type="button"
    class="w-full h-11 flex items-center justify-between gap-3 px-4 text-left text-sm rounded-[var(--radius-sm)] border-[1.5px] bg-white outline-none transition-all duration-150"
    [class]="'w-full h-11 flex items-center justify-between gap-3 px-4 text-left text-sm rounded-[var(--radius-sm)] border-[1.5px] bg-white outline-none transition-all duration-150 ' + (state === 'error' ? 'border-[var(--color-critico)]' : 'border-[var(--color-neutro-300)]') + (disabled ? ' opacity-60 cursor-not-allowed' : ' focus:border-[var(--color-azul-primario)]')"
    [class.opacity-60]="disabled"
    [class.cursor-not-allowed]="disabled"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'listbox'"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span [class.text-[var(--color-neutro-500)]]="!selectedOption">{{ selectedOption?.label ?? placeholder }}</span>
    <svg lucideChevronDown class="w-4 h-4 shrink-0 text-[var(--color-neutro-500)] transition-transform" [class.rotate-180]="open()"></svg>
  </button>

  @if (open()) {
    <div class="absolute left-0 right-0 top-full z-30 mt-1 max-h-60 overflow-y-auto rounded-[var(--radius-sm)] border border-[var(--color-neutro-200)] bg-white p-1 shadow-lg" role="listbox">
      @for (option of options; track option.value; let index = $index) {
        <button
          type="button"
          class="w-full flex items-center justify-between gap-3 rounded-[var(--radius-sm)] px-3 py-2.5 text-left text-sm transition-colors"
          [class]="'w-full flex items-center justify-between gap-3 rounded-[var(--radius-sm)] px-3 py-2.5 text-left text-sm transition-colors ' + (option.value === value() ? 'bg-[var(--color-azul-primario)]/10 text-[var(--color-azul-primario)]' : 'text-[var(--color-neutro-700)]') + (option.disabled ? ' opacity-50' : '')"
          [disabled]="option.disabled"
          role="option"
          [attr.aria-selected]="option.value === value()"
          (click)="choose(option)"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value()) { <svg lucideCheck class="w-4 h-4 shrink-0"></svg> }
        </button>
      }
    </div>
  }

  @if (helperText) { <span class="text-xs" [class.text-[var(--color-critico)]]="state === 'error'" [class.text-[var(--color-neutro-500)]]="state === 'default'">{{ helperText }}</span> }
</div>
