<div class="relative flex flex-row gap-1.5 items-center ">
  <label class="text-sm font-semibold text-[var(--color-neutro-500)]">
    {{ label }}:
  </label>

  <button
    [id]="inputId"
    type="button"
    class="flex flex-row gap-2 items-center px-3 py-2 font-bold rounded-lg focus:outline-none border-1 border-transparent focus:border-[var(--color-azul-primario)] text-sm text-[var(--color-neutro-900)] cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="disabled"
    [attr.aria-labelledby]="inputId + '-label'"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="inputId + '-calendar'"
    aria-haspopup="dialog"
    (click)="toggle()">
    <span class="truncate">{{ selectedRangeLabel() }}</span>
    <svg lucideChevronDown
      class="h-4 w-4 shrink-0 text-[var(--color-neutro-900)] transition-transform"
      [class.rotate-180]="open()"></svg>
  </button>

  @if (open()) {
  <div
    [id]="inputId + '-calendar'"
    class="absolute right-0 z-30 mt-2 w-[min(21rem,calc(100vw-2rem))] rounded-lg border border-[var(--color-neutro-150)] bg-white p-4 shadow-xl"
    role="dialog"
    [attr.aria-labelledby]="inputId + '-month'">
    <div class="mb-4 flex items-center justify-between gap-3">
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-neutro-600)] transition-colors hover:bg-[var(--color-neutro-100)] focus:outline-none"
        aria-label="Mês anterior"
        (click)="changeMonth(-1)">
        <svg lucideChevronLeft class="h-4 w-4"></svg>
      </button>
      <h2
        [id]="inputId + '-month'"
        class="font-heading text-sm font-bold capitalize text-[var(--color-neutro-900)]">
        {{ monthLabel() }}
      </h2>
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-neutro-600)] transition-colors hover:bg-[var(--color-neutro-100)] focus:outline-none"
        aria-label="Próximo mês"
        (click)="changeMonth(1)">
        <svg lucideChevronRight class="h-4 w-4"></svg>
      </button>
    </div>

    <div class="grid grid-cols-[2rem_repeat(7,minmax(0,1fr))] gap-1" role="grid"
      aria-label="Seleção de semana">
      <span
        class="flex h-8 items-center justify-center text-[10px] font-semibold uppercase text-[var(--color-neutro-400)]">Sem</span>
      @for (dayName of ['S', 'T', 'Q', 'Q', 'S', 'S', 'D']; track $index) {
      <span
        class="flex h-8 items-center justify-center text-xs font-semibold text-[var(--color-neutro-500)]">{{
        dayName }}</span>
      }

      @for (week of weeks(); track week.value) {
      <button
        type="button"
        class="flex h-9 items-center justify-center rounded-sm text-xs font-semibold text-[var(--color-neutro-500)] transition-colors hover:bg-black/90 hover:text-white focus:outline-none"
        [class.bg-[var(--color-laranja-primario)]]="isSelectedWeek(week)"
        [class.text-white]="isSelectedWeek(week)"
        [attr.aria-label]="'Selecionar semana ' + weekNumber(week.value)"
        [attr.aria-pressed]="isSelectedWeek(week)"
        (click)="selectWeek(week)">
        {{ weekNumber(week.value) }}
      </button>
      @for (day of week.days; track day.toISOString()) {
      <button
        type="button"
        class="flex h-9 items-center justify-center text-xs rounded-full transition-colors hover:bg-black/90 hover:text-white focus:outline-none"
        [class.text-[var(--color-neutro-300)]]="isOutsideMonth(day)"
        [class.text-[var(--color-neutro-700)]]="!isOutsideMonth(day) && !isSelectedWeek(week)"
        [class.bg-[var(--color-azul-primario)]]="isSelectedWeek(week)"
        [class.text-white]="isSelectedWeek(week)"
        [attr.aria-label]="'Selecionar semana ' + weekNumber(week.value) + ', dia ' + dayNumber(day)"
        [attr.aria-pressed]="isSelectedWeek(week)"
        (click)="selectWeek(week)">
        {{ dayNumber(day) }}
      </button>
      }
      }
    </div>

    <p class="mt-3 text-center text-xs text-[var(--color-neutro-500)]">
      Selecione qualquer dia ou o número da semana.
    </p>
  </div>
  }
</div>
