<div
    class="min-h-screen bg-[var(--color-azul-profundo)] flex items-center justify-center">
    <div
        class="w-full max-w-2xl overflow-hidden rounded-[var(--radius-lg)] border border-[var(--color-neutro-150)] bg-white">
        <div class="p-6">
            <button
                type="button"
                class="w-fit py-1.5 text-xs font-medium text-[var(--color-neutro-700)] transition hover:text-[var(--color-azul-500)] flex items-center gap-1"
                (click)="goBack()">
                <svg lucideChevronLeft
                    class="w-4 h-4 text-[var(--color-neutro-700)]"></svg> Voltar
                para a tela
                anterior
            </button>

            <div class="flex flex-col gap-4 p-4 mt-2">
                <div class="flex flex-col gap-2">
                    <h2
                        class="font-heading text-xl lg:text-2xl font-bold text-[var(--color-neutro-900)]">
                        Recuperar senha
                    </h2>
                    <p
                        class="text-xs lg:text-sm leading-6 text-[var(--color-neutro-700)]">
                        Informe seu e-mail cadastrado e enviaremos instruções
                        para
                        redefinir sua senha.
                    </p>
                </div>

                <form class="flex flex-col gap-6" (ngSubmit)="onSubmit()">
                    <app-input
                        label="E-mail"
                        type="email"
                        placeholder="seu@email.com"
                        [required]="true"
                        [(ngModel)]="email"
                        name="email"></app-input>

                    <div class="flex items-center justify-end gap-3">
                        <app-button type="submit" [loading]="isSubmitting">
                            Enviar instruções
                        </app-button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
