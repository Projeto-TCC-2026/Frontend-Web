<div
    class="min-h-screen bg-[var(--color-neutro-100)] flex items-center justify-center px-4 py-8 lg:px-8">
    <div
        class="w-full max-w-2xl overflow-hidden rounded-[var(--radius-lg)] border border-[var(--color-neutro-150)] bg-white shadow-[0_20px_60px_rgba(20,34,48,0.10)]">
        <div class="p-8 lg:p-12">
            <div class="mb-6">
                <h2
                    class="mt-2 font-heading text-xl lg:text-2xl font-semibold text-[var(--color-neutro-900)]">
                    Recuperar senha
                </h2>
                <p
                    class="mt-2 text-xs lg:text-sm leading-6 text-[var(--color-neutro-700)]">
                    Informe seu e-mail cadastrado e enviaremos instruções para
                    redefinir sua senha.
                </p>
            </div>
            <form class="space-y-4 flex flex-col" (ngSubmit)="onSubmit()">
                <app-input
                    label="E-mail"
                    type="email"
                    placeholder="seu@email.com"
                    [required]="true"
                    [(ngModel)]="email"
                    name="email"></app-input>

                <div class="flex flex-col gap-3 pt-2 sm:flex-row">
                    <app-button type="submit" [loading]="isSubmitting"
                        [fullWidth]="true">
                        Enviar instruções
                    </app-button>
                    <app-button variant="ghost" type="button"
                        (clicked)="goToLogin()">
                        Voltar para o login
                    </app-button>
                </div>
            </form>
        </div>
    </div>
</div>
