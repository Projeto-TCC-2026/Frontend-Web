<div>
  <!-- Cabeçalho -->
  <div class="flex items-center gap-3 mb-1">
    <button
      type="button"
      (click)="goBack()"
      class="p-1.5 rounded-md text-[var(--color-neutro-500)] hover:bg-[var(--color-neutro-100)] transition-all duration-150">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <h1 class="font-heading font-extrabold text-[32px] leading-10 text-[var(--color-neutro-900)]">
      Redefinir senha
    </h1>
  </div>

  <p class="text-sm text-[var(--color-neutro-500)] mb-8 ml-10">
    Escolha uma senha forte e diferente da atual.
  </p>

  <section class="bg-white border border-[var(--color-neutro-150)] rounded-[var(--radius-lg)] p-6 max-w-lg">
    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()">

      <app-input
        label="Senha atual"
        type="password"
        placeholder="••••••••"
        [required]="true"
        [(ngModel)]="currentPassword"
        name="currentPassword">
      </app-input>

      <hr class="border-[var(--color-neutro-150)]" />

      <app-input
        label="Nova senha"
        type="password"
        placeholder="••••••••"
        [required]="true"
        [(ngModel)]="newPassword"
        name="newPassword"
        helperText="Mínimo de 6 caracteres.">
      </app-input>

      <app-input
        label="Confirmar nova senha"
        type="password"
        placeholder="••••••••"
        [required]="true"
        [(ngModel)]="passwordConfirmation"
        name="passwordConfirmation">
      </app-input>

      <div class="flex flex-col gap-3 pt-2 sm:flex-row">
        <app-button type="submit" [loading]="isSubmitting" [fullWidth]="true">
          Salvar nova senha
        </app-button>
        <app-button variant="ghost" type="button" [fullWidth]="true" (clicked)="goBack()">
          Cancelar
        </app-button>
      </div>

    </form>
  </section>
</div>
