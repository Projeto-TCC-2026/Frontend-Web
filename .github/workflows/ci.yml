name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir a URL da API
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "
            const fs = require('fs');
            const url = JSON.stringify(process.env.API_BASE_URL);
            fs.writeFileSync(
              'src/environments/environment.prod.ts',
              'export const environment = {\n  production: true,\n  apiUrl: ' + url + '\n};\n'
            );
          "
          echo "URL da API aplicada ao build de produção."

      # Sem testes por enquanto: o projeto ainda nao tem nenhum arquivo .spec.ts
      # e o "ng test" falha com TS18003 quando nao encontra specs. Ao criar o
      # primeiro teste, reative o step abaixo (o script test:ci ja existe).
      #
      # - name: Testes unitários
      #   run: npm run test:ci

      - name: Compilar a aplicação
        run: npm run build

      - name: Guardar o artefato
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/recupera-saude/browser
          if-no-files-found: error
          retention-days: 7
