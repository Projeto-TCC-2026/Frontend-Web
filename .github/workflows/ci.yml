name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir a URL da API
        if: vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e "
            const fs = require('fs');
            const url = JSON.stringify(process.env.API_BASE_URL);
            fs.writeFileSync(
              'src/environments/environment.prod.ts',
              'export const environment = {\n  production: true,\n  apiUrl: ' + url + '\n};\n'
            );
          "
          echo "URL da API aplicada ao build de produção."

      - name: Testes unitários
        run: |
          if [ -n "$(find src -name '*.spec.ts' -print -quit)" ]; then
            npm run test:ci
          else
            echo "Nenhum arquivo .spec.ts encontrado - etapa de testes ignorada."
          fi

      - name: Compilar a aplicação
        run: npm run build

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/recupera-saude/browser
          if-no-files-found: error
          retention-days: 7
